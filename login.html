<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlogSpace - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">BlogSpace</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776;</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="create-blog.html">Create Blog</a></li>
        <span id="authLinks" style="display: contents"></span>
      </ul>
    </div>
  </header>

  <main class="auth">
    <aside class="auth-side">
      <h2>Good to see you again.</h2>
      <p>Log in to pick up your drafts and manage the blogs you have published.</p>
      <div class="auth-tags" aria-hidden="true">
        <span>#Technology</span><span>#Design</span><span>#Programming</span><span>#Travel</span>
      </div>
    </aside>

    <div class="form-wrapper">
      <div class="form-card">
        <h2>Log in</h2>
        <p class="sub">Enter your email and password.</p>

        <div id="message" class="message" role="alert"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" />
          </div>
          <button type="submit" class="btn btn-block">Log in</button>
        </form>

        <p class="form-footer">New here? <a href="register.html">Create an account</a></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    &copy; <span id="year"></span> BlogSpace. Built with HTML, CSS &amp; JavaScript.
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
