<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlogSpace - Create Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo">BlogSpace</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776;</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="create-blog.html" class="active">Create Blog</a></li>
        <span id="authLinks" style="display: contents"></span>
      </ul>
    </div>
  </header>

  <main class="form-wrapper">
    <div class="form-card wide">
      <h2>Write a new blog</h2>
      <p class="sub">Add a title, pick a category and publish. Your post shows up on the home page right away.</p>

      <div id="message" class="message"></div>

      <form id="blogForm" novalidate>
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="Blog title" />
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="">-- Select category --</option>
            <option>Technology</option>
            <option>Programming</option>
            <option>Design</option>
            <option>Lifestyle</option>
            <option>Travel</option>
            <option>Education</option>
          </select>
        </div>
        <div class="form-group">
          <label for="image">Image URL (optional)</label>
          <input type="url" id="image" name="image" placeholder="https://example.com/image.jpg" />
        </div>
        <div class="form-group">
          <label for="content">Content</label>
          <textarea id="content" name="content" rows="8" placeholder="Write your blog here..."></textarea>
        </div>
        <button type="submit" class="btn btn-block">Publish blog</button>
      </form>
    </div>
  </main>

  <footer class="footer">
    &copy; <span id="year"></span> BlogSpace. Built with HTML, CSS &amp; JavaScript.
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
